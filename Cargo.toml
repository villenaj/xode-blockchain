[workspace.package]
license = "MIT-0"
authors = ["Parity Technologies <admin@parity.io>", "Xode DAO <admin@xode.net>"]
homepage = "https://xode.net"
repository = "https://github.com/xode-blockchain/xode-blockchain"
version = "0.1.0"
edition = "2021"

[workspace.metadata.psvm]
version = "polkadot-stable2506-1"

[workspace]
members = ["node", "pallets/staking", "runtime"]
resolver = "2"

[workspace.dependencies]
# Local Project Pallets
xode-runtime            = { path = "./runtime", default-features = false }
pallet-xode-staking     = { path = "./pallets/staking", default-features = false }

# General Dependencies
async-trait = { version = "0.1.74" }
clap            = { version = "4.5.1", default-features = false }
color-print     = { version = "0.3.5" }
color-eyre      = { version = "0.6.3", default-features = false }
futures         = { version = "0.3.28", default-features = false }
hex-literal     = { version = "0.4.1", default-features = false }
hex             = { version = "0.4.3", default-features = false, features = ["alloc"] }
jsonrpsee       = { version = "0.24.8", default-features = false }
log             = { version = "0.4.17", default-features = false }
primitive-types = { version = "0.12.1", default-features = false, features = ["codec", "num-traits", "scale-info"] }
serde           = { version = "1.0.197", default-features = false, features = ["derive"] }
serde_json      = { version = "1.0.113", default-features = false }
smallvec        = { version = "1.11.1", default-features = false }

# Parity codec
parity-scale-codec  = { version = "3.6.12", default-features = false, features = ["derive"] }
scale-info          = { version = "2.11.1", default-features = false, features = ["derive"] }

# Substrate
assets-common                               = { version = "0.22.0", default-features = false }
