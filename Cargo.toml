# ORML
orml-traits         = { version = "1.5.0", default-features = false }
orml-xcm            = { version = "1.5.0", default-features = false }
orml-xcm-support    = { version = "1.5.0", default-features = false }
orml-xtokens        = { version = "1.5.0", default-features = false }

# integritee pallets
pallet-asset-registry   = { default-features = false, git = "https://github.com/integritee-network/pallets.git", branch = "cl/polkadot-stable2506-1" }
xcm-primitives          = { default-features = false, git = "https://github.com/integritee-network/pallets.git", branch = "cl/polkadot-stable2506-1" }

# prometheus-endpoint                         = { version = "0.17.0", default-features = false, package = "substrate-prometheus-endpoint" }

[profile.production]
codegen-units = 1
inherits = "release"
lto = true

[profile.release]
opt-level = 3
panic = "unwind"

[patch.crates-io]
core2 = { git = "https://github.com/bbqsrc/core2", rev = "545e84bcb0f235b12e21351e0c69767958efe2a7" }